name: Publicación

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  paquete:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gsventas-app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath
          coverage: none
      - name: Dependencias de producción
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
      - name: Armar el zip listo para servir
        run: |
          mkdir -p ../salida
          zip -qr "../salida/erp-neni-${GITHUB_REF_NAME}.zip" . \
            -x 'tests/*' 'phpunit.xml' '.env' 'storage/logs/*.log'
          cp composer.lock ../salida/composer.lock
      - name: Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" salida/* --title "$GITHUB_REF_NAME" --notes "Paquete de gsventas-app listo para servir, con vendor/ incluido. Descomprimir sobre la carpeta de la app conservando .env y storage/."
